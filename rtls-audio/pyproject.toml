[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtls-audio"
version = "0.1.0"
description = "RTLS+ Audio — Raspberry Pi Audio Recording & Management Application"
authors = [
    { name = "Jules", email = "jules@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyalsaaudio>=0.9.2",
    "PyYAML>=6.0",
]

[project.scripts]
rtls-audio = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
